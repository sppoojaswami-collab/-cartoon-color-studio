const colors=['#000000','#ffffff','#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#0a84ff','#5856d6','#af52de','#ff2d55','#795548','#f5deb3','#8e8e93'];
let activeCat='All',current=null,color='#ff3b30',tool='fill',down=false,last=null,undo=[],redo=[];
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{willReadFrequently:true});
const svgURL=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
function render(){grid.innerHTML='';const shown=PAGES.filter(p=>activeCat==='All'||p.category===activeCat);count.textContent=shown.length+' coloring pages';shown.forEach(p=>{const d=document.createElement('div');d.className='card';const im=document.createElement('img');im.src=svgURL(p.svg);im.alt=p.name;const t=document.createElement('b');t.textContent=p.name;d.append(im,t);d.onclick=()=>openPage(p);grid.append(d)})}
['All',...new Set(PAGES.map(p=>p.category))].forEach(c=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>{activeCat=c;document.querySelectorAll('#cats button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};cats.append(b);if(c==='All')b.classList.add('active')});
colors.forEach(x=>{const b=document.createElement('button');b.className='sw';b.style.background=x;b.onclick=()=>color=x;document.getElementById('colors').append(b)});
function openPage(p){current=p;gallery.style.display='none';editor.style.display='block';const im=new Image();im.onload=()=>{ctx.clearRect(0,0,900,700);ctx.drawImage(im,0,0,900,700);undo=[];redo=[]};im.src=svgURL(p.svg)}
document.getElementById('back').onclick=()=>{editor.style.display='none';gallery.style.display='block'};
function setTool(t){tool=t;['fill','brush','erase'].forEach(x=>document.getElementById(x).classList.toggle('active',x===t))}
document.getElementById('fill').onclick=()=>setTool('fill');document.getElementById('brush').onclick=()=>setTool('brush');document.getElementById('erase').onclick=()=>setTool('erase');
function snap(){undo.push(canvas.toDataURL());if(undo.length>20)undo.shift();redo=[]}function restore(s){const im=new Image();im.onload=()=>{ctx.clearRect(0,0,900,700);ctx.drawImage(im,0,0)};im.src=s}
document.getElementById('undo').onclick=()=>{if(undo.length){redo.push(canvas.toDataURL());restore(undo.pop())}};document.getElementById('redo').onclick=()=>{if(redo.length){undo.push(canvas.toDataURL());restore(redo.pop())}};
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download=(current?.name||'colored-cartoon')+'.png';a.href=canvas.toDataURL('image/png');a.click()};
function pos(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(899,Math.floor((e.clientX-r.left)*900/r.width))),y:Math.max(0,Math.min(699,Math.floor((e.clientY-r.top)*700/r.height)))}}
function paint(x,y){ctx.lineWidth=18;ctx.lineCap='round';ctx.globalCompositeOperation=tool==='erase'?'destination-out':'source-over';ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(x,y);ctx.stroke();ctx.globalCompositeOperation='source-over';last={x,y}}
function flood(x,y){const im=ctx.getImageData(0,0,900,700),d=im.data,target=[],i=(y*900+x)*4;for(let j=0;j<4;j++)target[j]=d[i+j];const h=color.slice(1),fc=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),255],q=[[x,y]],seen=new Uint8Array(630000);function ok(p){const k=p*4;return Math.abs(d[k]-target[0])+Math.abs(d[k+1]-target[1])+Math.abs(d[k+2]-target[2])+Math.abs(d[k+3]-target[3])<40}while(q.length){const [cx,cy]=q.pop();if(cx<0||cy<0||cx>=900||cy>=700)continue;const p=cy*900+cx;if(seen[p]||!ok(p))continue;seen[p]=1;const k=p*4;d[k]=fc[0];d[k+1]=fc[1];d[k+2]=fc[2];d[k+3]=255;q.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1])}ctx.putImageData(im,0,0)}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();down=true;snap();const p=pos(e);if(tool==='fill')flood(p.x,p.y);else{last=p;paint(p.x,p.y)}});canvas.addEventListener('pointermove',e=>{if(!down||tool==='fill')return;e.preventDefault();const p=pos(e);paint(p.x,p.y)});window.addEventListener('pointerup',()=>{down=false;last=null});render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
