<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="manifest.webmanifest">
<title>Cartoon Color Studio</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#111}
header{padding:14px 12px;text-align:center;font-size:21px;font-weight:800}
#cats,#tools,#colors{display:flex;gap:8px;overflow:auto;padding:7px 12px}
button{border:0;border-radius:13px;padding:11px 14px;background:#fff;box-shadow:0 1px 5px #0002;font-size:15px;white-space:nowrap}
button.active{outline:3px solid #777}
#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}
.card{background:#fff;border-radius:16px;padding:8px;box-shadow:0 1px 5px #0002}
.card img{width:100%;aspect-ratio:1.28;object-fit:contain;background:#fff;border-radius:10px}
.card b{display:block;text-align:center;padding:6px;font-size:14px}
#editor{display:none;padding:12px}
#back{margin-bottom:10px}.stage{background:#fff;border-radius:16px;padding:8px;box-shadow:0 1px 5px #0002}
canvas{width:100%;height:auto;display:block;touch-action:none}
#colors{padding-bottom:18px}
.sw{width:38px;height:38px;padding:0;border-radius:50%;flex:0 0 auto}
#count{text-align:center;color:#666;font-size:13px;padding:2px 0 8px}
@media(min-width:700px){#grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>🎨 Cartoon Color Studio</header>
<section id="gallery">
<div id="cats"></div>
<div id="count"></div>
<div id="grid"></div>
</section>
<section id="editor">
<button id="back">← Gallery</button>
<div class="stage"><canvas id="c" width="900" height="700"></canvas></div>
<div id="tools">
<button id="fill" class="active">🪣 Fill</button>
<button id="brush">✏️ Brush</button>
<button id="erase">🧽 Eraser</button>
<button id="undo">↩️ Undo</button>
<button id="redo">↪️ Redo</button>
<button id="save">💾 Save</button>
</div>
<div id="colors"></div>
</section>

const gallery=document.getElementById('gallery'), editor=document.getElementById('editor');
const grid=document.getElementById('grid'), cats=document.getElementById('cats'), count=document.getElementById('count');
const colors=['#000000','#ffffff','#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#0a84ff','#5856d6','#af52de','#ff2d55','#795548','#f5deb3','#8e8e93'];
let activeCat='All', current=null, color='#ff3b30', tool='fill', down=false,last=null,undo=[],redo=[];
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{willReadFrequently:true});
function svgURL(svg){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function render(){
 grid.innerHTML='';
 const shown=PAGES.filter(p=>activeCat==='All'||p.category===activeCat);
 count.textContent=shown.length+' coloring pages';
 shown.forEach(p=>{
  const d=document.createElement('div'); d.className='card';
  const im=document.createElement('img'); im.src=svgURL(p.svg); im.alt=p.name;
  const t=document.createElement('b'); t.textContent=p.name;
  d.append(im,t); d.addEventListener('click',()=>openPage(p)); grid.append(d);
 });
}
['All',...new Set(PAGES.map(p=>p.category))].forEach(c=>{
 const b=document.createElement('button'); b.textContent=c;
 b.addEventListener('click',()=>{activeCat=c;document.querySelectorAll('#cats button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});
 cats.append(b); if(c==='All')b.classList.add('active');
});
colors.forEach(x=>{const b=document.createElement('button');b.className='sw';b.style.background=x;b.setAttribute('aria-label','Color '+x);b.addEventListener('click',()=>color=x);document.getElementById('colors').append(b)});
function openPage(p){
 current=p; gallery.style.display='none'; editor.style.display='block';
 const im=new Image();
 im.onload=()=>{ctx.clearRect(0,0,900,700);ctx.drawImage(im,0,0,900,700);undo=[];redo=[]};
 im.src=svgURL(p.svg);
}
document.getElementById('back').onclick=()=>{editor.style.display='none';gallery.style.display='block'};
function setTool(t){tool=t;['fill','brush','erase'].forEach(x=>document.getElementById(x).classList.toggle('active',x===t))}
document.getElementById('fill').onclick=()=>setTool('fill');
document.getElementById('brush').onclick=()=>setTool('brush');
document.getElementById('erase').onclick=()=>setTool('erase');
function snap(){undo.push(canvas.toDataURL());if(undo.length>20)undo.shift();redo=[]}
function restore(s){const im=new Image();im.onload=()=>{ctx.clearRect(0,0,900,700);ctx.drawImage(im,0,0)};im.src=s}
document.getElementById('undo').onclick=()=>{if(undo.length){redo.push(canvas.toDataURL());restore(undo.pop())}};
document.getElementById('redo').onclick=()=>{if(redo.length){undo.push(canvas.toDataURL());restore(redo.pop())}};
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download=(current?.name||'colored-cartoon')+'.png';a.href=canvas.toDataURL('image/png');a.click()};
function pos(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(899,Math.floor((e.clientX-r.left)*900/r.width))),y:Math.max(0,Math.min(699,Math.floor((e.clientY-r.top)*700/r.height)))}}
function paint(x,y){
 ctx.lineWidth=18;ctx.lineCap='round';ctx.globalCompositeOperation=tool==='erase'?'destination-out':'source-over';ctx.strokeStyle=color;
 ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(x,y);ctx.stroke();ctx.globalCompositeOperation='source-over';last={x,y}
}
function flood(x,y){
 const im=ctx.getImageData(0,0,900,700),d=im.data,target=[],i=(y*900+x)*4;
 for(let j=0;j<4;j++)target[j]=d[i+j];
 const h=color.slice(1),fc=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),255];
 const q=[[x,y]],seen=new Uint8Array(630000);
 function ok(p){const k=p*4;return Math.abs(d[k]-target[0])+Math.abs(d[k+1]-target[1])+Math.abs(d[k+2]-target[2])+Math.abs(d[k+3]-target[3])<40}
 while(q.length){
  const [cx,cy]=q.pop(); if(cx<0||cy<0||cx>=900||cy>=700)continue;
  const p=cy*900+cx;if(seen[p]||!ok(p))continue;seen[p]=1;const k=p*4;
  d[k]=fc[0];d[k+1]=fc[1];d[k+2]=fc[2];d[k+3]=255;
  q.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
 }
 ctx.putImageData(im,0,0);
}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();down=true;snap();const p=pos(e);if(tool==='fill')flood(p.x,p.y);else{last=p;paint(p.x,p.y)}});
canvas.addEventListener('pointermove',e=>{if(!down||tool==='fill')return;e.preventDefault();const p=pos(e);paint(p.x,p.y)});
window.addEventListener('pointerup',()=>{down=false;last=null});
render();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
