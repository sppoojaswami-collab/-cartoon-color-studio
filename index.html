<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f5f7"><title>Cartoon Color Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:16px;text-align:center;font-size:22px;font-weight:800}
#cats,#tools,#colors{display:flex;gap:8px;padding:8px 12px;overflow:auto}
button{background:white;border:0;border-radius:14px;padding:11px 14px;font-size:15px;box-shadow:0 2px 7px #0002;white-space:nowrap}
.active{outline:3px solid #777}#count{text-align:center;color:#666;padding:4px}
#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}
.card{background:#fff;border-radius:16px;padding:8px;box-shadow:0 2px 8px #0002}
.card img{display:block;width:100%;aspect-ratio:9/11;object-fit:contain;border-radius:10px}
.card b{display:block;text-align:center;padding:8px 3px}
#editor{display:none;padding:10px}.stage{background:white;border-radius:16px;padding:6px}
canvas{width:100%;height:auto;display:block;touch-action:none}.sw{width:38px;height:38px;padding:0;border-radius:50%}
@media(min-width:800px){#grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<header>🎨 Cartoon Color Studio — Premium Pages</header>
<section id="gallery"><div id="cats"></div><div id="count"></div><div id="grid"></div></section>
<section id="editor"><button id="back">← Gallery</button>
<div class="stage"><canvas id="c" width="900" height="1100"></canvas></div>
<div id="tools"><button id="fill">🪣 Fill</button><button id="brush">✏️ Brush</button>
<button id="erase">🧽 Eraser</button><button id="undo">↩️ Undo</button>
<button id="redo">↪️ Redo</button><button id="save">💾 Save</button></div>
<div id="colors"></div></section>
<script>
const P=[{"id":1,"file":"images/001.jpg","name":"Premium Coloring Page 1","category":"Premium Scenes"},{"id":2,"file":"images/002.jpg","name":"Premium Coloring Page 2","category":"Premium Scenes"},{"id":3,"file":"images/003.jpg","name":"Premium Coloring Page 3","category":"Premium Scenes"},{"id":4,"file":"images/004.jpg","name":"Premium Coloring Page 4","category":"Premium Scenes"},{"id":5,"file":"images/005.jpg","name":"Premium Coloring Page 5","category":"Premium Scenes"},{"id":6,"file":"images/006.jpg","name":"Premium Coloring Page 6","category":"Premium Scenes"},{"id":7,"file":"images/007.jpg","name":"Premium Coloring Page 7","category":"Premium Scenes"},{"id":8,"file":"images/008.jpg","name":"Premium Coloring Page 8","category":"Premium Scenes"},{"id":9,"file":"images/009.jpg","name":"Premium Coloring Page 9","category":"Premium Scenes"},{"id":10,"file":"images/010.jpg","name":"Premium Coloring Page 10","category":"Premium Scenes"},{"id":11,"file":"images/011.jpg","name":"Premium Coloring Page 11","category":"Premium Scenes"},{"id":12,"file":"images/012.jpg","name":"Premium Coloring Page 12","category":"Premium Scenes"},{"id":13,"file":"images/013.jpg","name":"Premium Coloring Page 13","category":"Premium Scenes"},{"id":14,"file":"images/014.jpg","name":"Premium Coloring Page 14","category":"Premium Scenes"},{"id":15,"file":"images/015.jpg","name":"Premium Coloring Page 15","category":"Premium Scenes"},{"id":16,"file":"images/016.jpg","name":"Premium Coloring Page 16","category":"Premium Scenes"},{"id":17,"file":"images/017.jpg","name":"Premium Coloring Page 17","category":"Premium Scenes"},{"id":18,"file":"images/018.jpg","name":"Premium Coloring Page 18","category":"Premium Scenes"},{"id":19,"file":"images/019.jpg","name":"Premium Coloring Page 19","category":"Premium Scenes"},{"id":20,"file":"images/020.jpg","name":"Premium Coloring Page 20","category":"Premium Scenes"},{"id":21,"file":"images/021.jpg","name":"Premium Coloring Page 21","category":"Premium Scenes"},{"id":22,"file":"images/022.jpg","name":"Premium Coloring Page 22","category":"Premium Scenes"},{"id":23,"file":"images/023.jpg","name":"Premium Coloring Page 23","category":"Premium Scenes"},{"id":24,"file":"images/024.jpg","name":"Premium Coloring Page 24","category":"Premium Scenes"},{"id":25,"file":"images/025.jpg","name":"Premium Coloring Page 25","category":"Premium Scenes"},{"id":26,"file":"images/026.jpg","name":"Premium Animal Page 26","category":"Wild Animals"},{"id":27,"file":"images/027.jpg","name":"Premium Animal Page 27","category":"Wild Animals"},{"id":28,"file":"images/028.jpg","name":"Premium Animal Page 28","category":"Wild Animals"},{"id":29,"file":"images/029.jpg","name":"Premium Animal Page 29","category":"Wild Animals"},{"id":30,"file":"images/030.jpg","name":"Premium Animal Page 30","category":"Wild Animals"},{"id":31,"file":"images/031.jpg","name":"Premium Animal Page 31","category":"Wild Animals"},{"id":32,"file":"images/032.jpg","name":"Premium Animal Page 32","category":"Wild Animals"},{"id":33,"file":"images/033.jpg","name":"Premium Animal Page 33","category":"Wild Animals"},{"id":34,"file":"images/034.jpg","name":"Premium Animal Page 34","category":"Wild Animals"},{"id":35,"file":"images/035.jpg","name":"Premium Animal Page 35","category":"Wild Animals"},{"id":36,"file":"images/036.jpg","name":"Premium Animal Page 36","category":"Wild Animals"},{"id":37,"file":"images/037.jpg","name":"Premium Animal Page 37","category":"Wild Animals"}],grid=document.querySelector('#grid'),cats=document.querySelector('#cats'),count=document.querySelector('#count');
let cat='All',tool='fill',color='#ff3b30',cur,undoStack=[],redoStack=[],down=false,last;
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d',{willReadFrequently:true});
function render(){
 grid.innerHTML='';
 const a=P.filter(x=>cat==='All'||x.category===cat);
 count.textContent=a.length+' premium coloring pages';
 a.forEach(p=>{
  const d=document.createElement('div'); d.className='card';
  const i=document.createElement('img'); i.src=p.file;
  const b=document.createElement('b'); b.textContent=p.name;
  d.append(i,b); d.onclick=()=>openPage(p); grid.append(d);
 });
}
['All',...new Set(P.map(x=>x.category))].forEach(x=>{
 const b=document.createElement('button'); b.textContent=x;
 b.onclick=()=>{cat=x;document.querySelectorAll('#cats button').forEach(q=>q.classList.remove('active'));b.classList.add('active');render()};
 if(x==='All')b.classList.add('active'); cats.append(b);
});
function openPage(p){
 cur=p; gallery.style.display='none'; editor.style.display='block';
 const im=new Image(); im.onload=()=>{ctx.clearRect(0,0,900,1100);ctx.drawImage(im,0,0,900,1100);undoStack=[];redoStack=[]};
 im.src=p.file;
}
back.onclick=()=>{editor.style.display='none';gallery.style.display='block'};
function snapshot(){undoStack.push(canvas.toDataURL());if(undoStack.length>15)undoStack.shift();redoStack=[]}
function restore(s){const i=new Image();i.onload=()=>{ctx.clearRect(0,0,900,1100);ctx.drawImage(i,0,0)};i.src=s}
undo.onclick=()=>{if(undoStack.length){redoStack.push(canvas.toDataURL());restore(undoStack.pop())}};
redo.onclick=()=>{if(redoStack.length){undoStack.push(canvas.toDataURL());restore(redoStack.pop())}};
fill.onclick=()=>tool='fill';brush.onclick=()=>tool='brush';erase.onclick=()=>tool='erase';
['#111111','#ffffff','#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#0a84ff','#5856d6','#af52de','#ff2d55','#795548'].forEach(x=>{
 const b=document.createElement('button');b.className='sw';b.style.background=x;b.onclick=()=>color=x;colors.append(b);
});
save.onclick=()=>{const a=document.createElement('a');a.download=(cur?.name||'coloring-page')+'.png';a.href=canvas.toDataURL('image/png');a.click()};
function pos(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(899,((e.clientX-r.left)*900/r.width)|0)),y:Math.max(0,Math.min(1099,((e.clientY-r.top)*1100/r.height)|0))}}
function stroke(p){ctx.lineWidth=18;ctx.lineCap='round';ctx.globalCompositeOperation=tool==='erase'?'destination-out':'source-over';ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.globalCompositeOperation='source-over';last=p}
function flood(x,y){
 const im=ctx.getImageData(0,0,900,1100),d=im.data,idx=(y*900+x)*4;
 const target=[d[idx],d[idx+1],d[idx+2],d[idx+3]],h=color.slice(1);
 const fillColor=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),255];
 const q=[[x,y]],seen=new Uint8Array(990000);
 function same(k){return Math.abs(d[k]-target[0])+Math.abs(d[k+1]-target[1])+Math.abs(d[k+2]-target[2])+Math.abs(d[k+3]-target[3])<45}
 while(q.length){
  const [a,b]=q.pop(); if(a<0||b<0||a>=900||b>=1100)continue;
  const p=b*900+a,k=p*4; if(seen[p]||!same(k))continue; seen[p]=1;
  d[k]=fillColor[0];d[k+1]=fillColor[1];d[k+2]=fillColor[2];d[k+3]=255;
  q.push([a+1,b],[a-1,b],[a,b+1],[a,b-1]);
 }
 ctx.putImageData(im,0,0);
}
canvas.onpointerdown=e=>{e.preventDefault();down=true;snapshot();const p=pos(e);if(tool==='fill')flood(p.x,p.y);else{last=p;stroke(p)}};
canvas.onpointermove=e=>{if(down&&tool!=='fill'){e.preventDefault();stroke(pos(e))}};
window.onpointerup=()=>{down=false;last=null};render();
</script></body></html>
