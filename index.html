function snap(){undo.push(canvas.toDataURL());if(undo.length>15)undo.shift();redo=[]}function restore(s){let i=new Image();i.onload=()=>{ctx.clearRect(0,0,900,1200);ctx.drawImage(i,0,0)};i.src=s}
undoBtn=document.getElementById('undo');redoBtn=document.getElementById('redo');undoBtn.onclick=()=>{if(undo.length){redo.push(canvas.toDataURL());restore(undo.pop())}};redoBtn.onclick=()=>{if(redo.length){undo.push(canvas.toDataURL());restore(redo.pop())}};

function pos(e){let r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(899,((e.clientX-r.left)*900/r.width)|0)),y:Math.max(0,Math.min(1199,((e.clientY-r.top)*1200/r.height)|0))}}
function stroke(x,y){ctx.lineWidth=20;ctx.lineCap='round';ctx.globalCompositeOperation=tool==='erase'?'destination-out':'source-over';ctx.strokeStyle=col;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(x,y);ctx.stroke();ctx.globalCompositeOperation='source-over';last={x,y}}
function flood(x,y){let im=ctx.getImageData(0,0,900,1200),d=im.data,i=(y*900+x)*4,t=[d[i],d[i+1],d[i+2],d[i+3]],h=col.slice(1),f=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),255],q=[[x,y]],seen=new Uint8Array(1080000);function ok(p){let k=p*4;return Math.abs(d[k]-t[0])+Math.abs(d[k+1]-t[1])+Math.abs(d[k+2]-t[2])+Math.abs(d[k+3]-t[3])<45}while(q.length){let [a,b]=q.pop();if(a<0||b<0||a>=900||b>=1200)continue;let p=b*900+a;if(seen[p]||!ok(p))continue;seen[p]=1;let k=p*4;d[k]=f[0];d[k+1]=f[1];d[k+2]=f[2];d[k+3]=255;q.push([a+1,b],[a-1,b],[a,b+1],[a,b-1])}ctx.putImageData(im,0,0)}
