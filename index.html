<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f5f7">
<title>🎨 Cartoon Color Studio</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:16px 12px 8px;text-align:center;font-size:24px;font-weight:800}
#status{text-align:center;color:#666;font-size:13px;padding:4px 12px}
#cats,#tools,#colors{display:flex;gap:8px;padding:8px 12px;overflow:auto}
button{background:#fff;border:0;border-radius:14px;padding:11px 14px;font-size:15px;box-shadow:0 2px 7px #0002;white-space:nowrap}
button.active{outline:3px solid #777}
#offline{background:#111;color:#fff}
#count{text-align:center;color:#666;padding:6px}
#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}
.card{background:#fff;border-radius:17px;padding:8px;box-shadow:0 2px 8px #0002}
.card img{display:block;width:100%;aspect-ratio:2550/3300;object-fit:contain;border-radius:10px;background:#fff}
.card b{display:block;text-align:center;padding:8px 3px;font-size:15px}
#editor{display:none;padding:10px}
.stage{background:#fff;border-radius:16px;padding:6px;box-shadow:0 2px 8px #0002;overflow:auto}
canvas{width:100%;height:auto;display:block;touch-action:none}
#tools{position:sticky;bottom:0;background:#f5f5f7;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.sw{width:38px;height:38px;padding:0;border-radius:50%}
#progress{height:5px;background:#ddd;margin:5px 12px;border-radius:4px;overflow:hidden}
#bar{height:100%;width:0;background:#111}
@media(min-width:800px){#grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>🎨 Cartoon Color Studio</header>
<div id="status">120 high-quality coloring pages • online first load</div>
<div id="progress"><div id="bar"></div></div>
<section id="gallery">

  <div id="count"></div>
  <div id="grid"></div>
  <div id="tools"><button id="offline">✈️ Prepare for Airplane Mode</button></div>
</section>
<section id="editor">
  <button id="back">← Gallery</button>
  <div class="stage"><canvas id="c" width="900" height="1160"></canvas></div>
  <div id="tools">

  </div>
  <div id="colors"></div>
</section>

const gallery=document.getElementById('gallery'),editor=document.getElementById('editor');
const grid=document.getElementById('grid'),cats=document.getElementById('cats'),count=document.getElementById('count');
const status=document.getElementById('status'),bar=document.getElementById('bar');
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{willReadFrequently:true});
let cat='All',tool='fill',color='#ff3b30',cur=null,undoStack=[],redoStack=[],down=false,last=null;

function render(){
 grid.innerHTML='';
 const a=P.filter(x=>cat==='All'||x.category===cat);
 count.textContent=a.length+' coloring pages';
 a.forEach(p=>{
   const d=document.createElement('div'); d.className='card';
   const i=document.createElement('img'); i.loading='lazy'; i.src=p.url; i.alt=p.name;
   const b=document.createElement('b'); b.textContent=p.name;
   d.append(i,b); d.onclick=()=>openPage(p); grid.append(d);
 });
}

 const b=document.createElement('button'); b.textContent=x;
 b.onclick=()=>{cat=x;document.querySelectorAll('#cats button').forEach(q=>q.classList.remove('active'));
 b.classList.add('active');render()};
 if(x==='All')b.classList.add('active');cats.append(b);
});

function openPage(p){
 cur=p; gallery.style.display='none'; editor.style.display='block';
 const im=new Image(); im.crossOrigin='anonymous';
 im.onload=()=>{
   ctx.clearRect(0,0,900,1160);
   // Preserve the full printable page and fit it into our working canvas.
   const scale=Math.min(900/im.width,1100/im.height);
   const w=im.width*scale,h=im.height*scale,x=(900-w)/2,y=10;
   ctx.drawImage(im,x,y,w,h);
   undoStack=[];redoStack=[];
 };
 im.src=p.url;
}
back.onclick=()=>{editor.style.display='none';gallery.style.display='block'};

function snapshot(){undoStack.push(canvas.toDataURL('image/png'));if(undoStack.length>12)undoStack.shift();redoStack=[]}
function restore(s){const i=new Image();i.onload=()=>{ctx.clearRect(0,0,900,1160);ctx.drawImage(i,0,0)};i.src=s}
undo.onclick=()=>{if(undoStack.length){redoStack.push(canvas.toDataURL('image/png'));restore(undoStack.pop())}};
redo.onclick=()=>{if(redoStack.length){undoStack.push(canvas.toDataURL('image/png'));restore(redoStack.pop())}};
fill.onclick=()=>tool='fill';brush.onclick=()=>tool='brush';erase.onclick=()=>tool='erase';

['#111111','#ffffff','#ff3b30','#ff9500','#ffcc00','#34c759','#00c7be','#0a84ff','#5856d6','#af52de','#ff2d55','#795548'].forEach(x=>{
 const b=document.createElement('button');b.className='sw';b.style.background=x;b.onclick=()=>color=x;colors.append(b)
});
save.onclick=()=>{const a=document.createElement('a');a.download=(cur?.name||'coloring-page')+'.png';a.href=canvas.toDataURL('image/png');a.click()};

function pos(e){
 const r=canvas.getBoundingClientRect();
 return{x:Math.max(0,Math.min(899,Math.floor((e.clientX-r.left)*900/r.width))),
 y:Math.max(0,Math.min(1159,Math.floor((e.clientY-r.top)*1160/r.height)))}
}
function stroke(p){
 ctx.lineWidth=16;ctx.lineCap='round';ctx.globalCompositeOperation=tool==='erase'?'destination-out':'source-over';
 ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.globalCompositeOperation='source-over';last=p
}
function flood(x,y){
 const im=ctx.getImageData(0,0,900,1160),d=im.data,idx=(y*900+x)*4;
 const target=[d[idx],d[idx+1],d[idx+2],d[idx+3]],h=color.slice(1);
 const f=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16),255];
 const q=[[x,y]],seen=new Uint8Array(1044000);
 function same(k){
   return Math.abs(d[k]-target[0])+Math.abs(d[k+1]-target[1])+Math.abs(d[k+2]-target[2])+Math.abs(d[k+3]-target[3])<70
 }
 while(q.length){
   const [a,b]=q.pop();if(a<0||b<0||a>=900||b>=1160)continue;
   const p=b*900+a,k=p*4;if(seen[p]||!same(k))continue;seen[p]=1;
   d[k]=f[0];d[k+1]=f[1];d[k+2]=f[2];d[k+3]=255;
   q.push([a+1,b],[a-1,b],[a,b+1],[a,b-1]);
 }
 ctx.putImageData(im,0,0);
}
canvas.onpointerdown=e=>{e.preventDefault();down=true;snapshot();const p=pos(e);if(tool==='fill')flood(p.x,p.y);else{last=p;stroke(p)}};
canvas.onpointermove=e=>{if(down&&tool!=='fill'){e.preventDefault();stroke(pos(e))}};
window.onpointerup=()=>{down=false;last=null};

async function prepareOffline(){
 status.textContent='Preparing pages for airplane mode… 0 / '+P.length;
 let done=0;
 const cache=await caches.open('color-pages-v1');
 for(const p of P){
   try{
     const r=await fetch(p.url,{mode:'no-cors',cache:'force-cache'});
     await cache.put(p.url,r.clone());
   }catch(e){}
   done++;bar.style.width=(done/P.length*100)+'%';
   status.textContent='Preparing pages for airplane mode… '+done+' / '+P.length;
 }
 status.textContent='✈️ Ready for airplane mode — '+done+' pages prepared';
}
offline.onclick=prepareOffline;
render();
</script>
